# Visual styles. The words on every page are identical across styles; only presentation changes.
# Each style lists its value for every factor used in RQ3, so factor analysis can read them here.
# Colours are proposals. Fonts are bundled in assets/fonts/; system fonts are never used.

page:
  width_px: 1024
  height_px: 1366
  margin_px: 48

# Font family name -> bundled files (relative to fonts_dir). See assets/fonts/README.md.
fonts_dir: assets/fonts
fonts:
  "Noto Serif":
    regular: NotoSerif-Regular.ttf
    bold: NotoSerif-Bold.ttf
  "Noto Sans":
    regular: NotoSans-Regular.ttf
    bold: NotoSans-Bold.ttf
  "Noto Sans Mono":
    regular: NotoSansMono-Regular.ttf
    bold: NotoSansMono-Bold.ttf
  "Noto Sans Math":
    regular: NotoSansMath-Regular.ttf
  "Noto Sans Symbols 2":
    regular: NotoSansSymbols2-Regular.ttf

# Used after the style's font for characters it lacks (e.g. ≥ ≤ ∼ → ■), in every style.
fallback_fonts: ["Noto Sans Math", "Noto Sans Symbols 2"]

# Long documents are cut at the same word for every style, and each cut is logged.
# The limit is chosen in the rendering task so the text fits the densest-capacity style.
truncation:
  unit: words
  max_words: null

reference_style: plain

styles:
  plain:
    font: "Noto Serif"
    font_size_px: 16
    columns: 1
    text_color: "#000000"
    background_color: "#ffffff"
    heading_color: "#000000"
    layout: document
    decoration: none

  sans:
    font: "Noto Sans"
    font_size_px: 16
    columns: 1
    text_color: "#000000"
    background_color: "#ffffff"
    heading_color: "#000000"
