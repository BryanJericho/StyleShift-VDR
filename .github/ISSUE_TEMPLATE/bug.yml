name: Bug report
description: Something in the code does not work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands you ran, with the config files you used.
      render: bash
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste the traceback or log. Remove any tokens or personal paths first.
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS or platform (local, Kaggle, Colab), GPU.
      placeholder: "Python 3.11, Kaggle, T4"
